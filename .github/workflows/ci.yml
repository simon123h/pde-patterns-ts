name: CI

# Fast checks run for every pull request and for pushes to main. The browser self-tests run the
# WebGPU code on a software GPU and take minutes, so they run only on pull requests that touch
# code they cover (the merged result was already tested in the pull request), split into parallel jobs.

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch or pull request cancels the CI run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "browser=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$files"
          # GPU code, solver and shaders, rendering, models, math, test pages and runner, build setup, this workflow
          pattern='^(src/(gpu|solver|render|models|math)/|[a-z-]+-test\.html$|scripts/|package(-lock)?\.json$|vite\.config\.ts$|tsconfig\.json$|\.github/workflows/)'
          if echo "$files" | grep -Eq "$pattern"; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  browser:
    name: Browser self-test (${{ matrix.page }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the solver page is split by group (one job per equation, see ?only= in solverSelfTest.ts) because
        # one job takes 8-15 minutes on a software GPU and runners differ in speed by a factor of 2-3;
        # tests/ci.test.ts checks that every equation is listed
        page:
          - fft
          - render
          - solver:swift-hohenberg
          - solver:cahn-hilliard
          - solver:kuramoto-sivashinsky
          - solver:nikolaevskiy
          - solver:advection-diffusion
          - solver:cgle
          - solver:gray-scott
          - solver:brusselator
          - solver:thin-film
          - solver:adaptive
          - solver:coef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:browser -- ${{ matrix.page }}
